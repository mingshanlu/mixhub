function syncCanvasSize(){

function hudUpdate(){if(!p)return;document.getElementById("score").textContent=Math.floor(score).toLocaleString();document.getElementById("hp").textContent="♥".repeat(Math.max(0,p.hp))+"♡".repeat(Math.max(0,p.max-p.hp));document.getElementById("bombs").textContent=p.bombs;document.getElementById("bombText").textContent=p.bombs+" 顆";document.getElementById("bossCount").textContent=bossN+"/"+seasons[runSeason].bosses;let bar=document.getElementById("bossbar");bar.style.display=boss?"block":"none";if(boss){document.getElementById("bossfill").style.width=Math.max(0,boss.hp/boss.max*100)+"%";let fmt=v=>Number.isInteger(v)?v.toLocaleString():v.toFixed(1);document.getElementById("bosshp").textContent=fmt(Math.max(0,boss.hp))+" / "+fmt(boss.max)}let installed=defs.filter(d=>p.weapons[d[0]]&&(d[0]!=="single"||p.weapons.single>=2)),cells="";for(let i=0;i<cap();i++){let d=installed[i];if(d){let lv=p.weapons[d[0]];cells+='<div class="slot" title="'+d[1]+' Lv.'+lv+'">'+weaponIcon(d[0])+'<span class="slot-text"><b>'+d[1]+'</b><small>Lv.'+lv+'</small></span></div>'}else cells+='<div class="slot empty"><span>空格</span></div>'}loadout.innerHTML='<div class="loadout-grid">'+cells+'</div>';loadout.style.display=["play","upgrade","pause"].includes(state)?"block":"none"}

function defeatedBosses(){return Math.max(0,bossN-(boss?1:0))}
function enemyGrowth(){return Math.min(Math.pow(PARAMS.enemy.bulletGrowthPerBoss,defeatedBosses()),PARAMS.enemy.maxBulletGrowth)}
function enemyIntervalSeconds(){let z=PARAMS.enemy;return Math.max(z.minIntervalMs,z.baseIntervalMs/Math.max(.1,z.bulletDensityMultiplier)*Math.pow(z.intervalDecay,defeatedBosses()))/1000}
function scaledBulletCount(base){let exact=base*enemyGrowth()*PARAMS.enemy.bulletDensityMultiplier,whole=Math.floor(exact);return Math.max(1,whole+(Math.random()<exact-whole?1:0))}
function fireEnemyPattern(e){

 for(let i=0;i<n;i++){let angle=aim;if(mode===0)angle+=n===1?0:(i-(n-1)/2)*.14;else if(mode===1)angle+=(i-(n-1)/2)*.28;else angle+=cross[i%cross.length];eb.push({x:e.x,y:e.y+e.r,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:e.mid?5:4,col:e.mid?"#ffb178":"#ff715f"})}
}

function spawnBoss(){bossN++;haptic("boss");let isBig=bossN%2===0;if(bossN===1&&meta.s0===0){meta.s0=Math.max(1,Math.floor(score));save()}let hp=Math.max(1,score*PARAMS.boss.scoreHealthRatio);boss={x:W/2,y:110,hp,max:hp,big:isBig,r:isBig?PARAMS.boss.bigRadius:PARAMS.boss.smallRadius,shot:1.3,age:0,flash:0,slowUntil:0};if(isBig)en=[];else en=en.filter(e=>!e.mid).slice(0,3);setMusic("boss");sfx("boss");toast((isBig?"大型":"小型")+" Boss 來襲！");hudUpdate()}

function fire(id,lv){

 if(id==="machine"){let z=E.machine,n=lv>=6?z.level6Pellets:Math.min(z.maxPellets,z.basePellets+lv-1);for(let i=0;i<n;i++){let lane=i-(n-1)/2,a=lane*.045;if(lv>=6&&Math.abs(lane)>3)a=lane*.09;pb.push({x:xx,y:yy,vx:Math.sin(a)*z.speed,vy:-Math.cos(a)*z.speed,dmg:z.damage,col,r:3,id})}}
 if(id==="spread"){let z=E.spread,n=z.basePellets+lv*z.pelletsPerLevel,span=z.angleByLevel[lv-1]*Math.PI/180;for(let i=0;i<n;i++){let a=-span/2+span*i/(n-1);pb.push({x:xx,y:yy,vx:Math.sin(a)*z.speed,vy:-Math.cos(a)*z.speed,dmg:z.damage,col,r:3,id})}}
 if(id==="tracking"){let ts=targets().filter(t=>t.y<yy);for(let i=0;i<lv;i++){let t=ts.length?ts[i%ts.length]:null;pb.push({x:xx+(i-(lv-1)/2)*5,y:yy,vx:0,vy:-E.tracking.speed,dmg:E.tracking.damage,col,r:4,id,life:E.tracking.seekSeconds,target:t,initialAngle:0,turning:true,level:lv})}}

 if(id==="electric"){let z=E.electric,chainRange=W*z.chainDistanceRatio,firstRange=Math.hypot(W,H),pool=targets().filter(t=>t.y<yy&&t.y>-t.r&&t.y<H),ts=[],from={x:xx,y:yy},damage=z.initialDamage+(lv-1)*z.damagePerLevel;while(ts.length<lv&&pool.length){let best=-1,bestDist=ts.length?chainRange:firstRange;for(let i=0;i<pool.length;i++){let d=Math.hypot(pool[i].x-from.x,pool[i].y-from.y);if(d<=bestDist){best=i;bestDist=d}}if(best<0)break;let e=pool.splice(best,1)[0];ts.push(e);from={x:e.x,y:e.y}}from={x:xx,y:yy};let points=[from];for(let e of ts){points.push(...jaggedPoints(from,{x:e.x,y:e.y},9,14).slice(1));e.hp-=damage;e.flash=.14;burst(e.x,e.y,col,7);if(e.hp<=0)kill(e);from={x:e.x,y:e.y}}if(points.length>1)bolts.push({points,life:z.boltSeconds,max:z.boltSeconds})}
 if(id==="flame"){let z=E.flame,count=z.baseProjectiles+Math.floor((lv-1)/2),span=(count-1)*z.angleStepDegrees*Math.PI/180;for(let i=0;i<count;i++){let a=count===1?0:-span/2+span*i/(count-1);pb.push({x:xx,y:yy,vx:Math.sin(a)*z.speed,vy:-Math.cos(a)*z.speed,dmg:z.damage,col,r:z.radius,id,life:z.lifeSeconds})}}

function jaggedPoints(a,b,count,jitter){let pts=[{x:a.x,y:a.y}];for(let i=1;i<count;i++){let q=i/count;pts.push({x:a.x+(b.x-a.x)*q+rand(-jitter,jitter),y:a.y+(b.y-a.y)*q+rand(-jitter,jitter)})}pts.push({x:b.x,y:b.y});return pts}

function shoot(dt){let perm=1+.06*(meta.spent[3]||0);for(let id in p.weapons){let lv=p.weapons[id],d=weapon(id),interval=d[3]/(perm*Math.pow(1+d[4],lv-1));if(id==="flame")interval=Math.max(1000,3000/(perm*Math.pow(1+d[4],lv-1)));fireT[id]=(fireT[id]||0)-dt;if(fireT[id]<=0){fireT[id]=Math.max(200,interval)/1000;fire(id,lv)}}}

function drawBoss(b){x.save();x.translate(b.x,b.y);x.fillStyle=b.big?"#bd76ff":"#ff5d78";x.shadowColor=x.fillStyle;x.shadowBlur=20;x.beginPath();x.moveTo(0,b.r);x.lineTo(b.r*1.35,0);x.lineTo(b.r*.62,-b.r*.15);x.lineTo(b.r*.35,-b.r*.7);x.lineTo(0,-b.r*.42);x.lineTo(-b.r*.35,-b.r*.7);x.lineTo(-b.r*.62,-b.r*.15);x.lineTo(-b.r*1.35,0);x.closePath();x.fill();x.fillStyle="#fff0b0";x.fillRect(-6,-12,12,23);if(b.burnUntil>now){x.strokeStyle="#ff8b38";x.lineWidth=3;x.beginPath();x.arc(0,0,b.r+7,0,6.28);x.stroke();x.fillStyle="#ffb04a";for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(i*12-4,-b.r+4);x.lineTo(i*12,-b.r-6);x.lineTo(i*12+4,-b.r+4);x.fill()}}if(b.slowUntil>now){x.strokeStyle="#73eaff";x.lineWidth=3;x.setLineDash([5,3]);x.beginPath();x.arc(0,0,b.r+13,0,6.28);x.stroke();x.setLineDash([])}x.restore()}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;now+=dt;update(dt);draw();requestAnimationFrame(frame)}
function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
